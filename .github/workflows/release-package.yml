name: Release npm package

on:
    workflow_call:
        inputs:
            package_path:
                description: Workspace-relative path to the package
                required: true
                type: string
            package_name:
                description: npm package name
                required: true
                type: string
            tag_prefix:
                description: Package-specific Git tag prefix
                required: true
                type: string
            prerelease:
                description: Publish an alpha prerelease
                required: true
                type: boolean
            version_bump:
                description: Semantic version update
                required: true
                type: string
            branch:
                description: Branch that receives the version commit
                required: true
                type: string
            environment_name:
                description: Protected publishing environment
                required: true
                type: string

permissions:
    contents: write
    id-token: write

jobs:
    release:
        name: Release ${{ inputs.package_name }}
        runs-on: ubuntu-latest
        environment:
            name: ${{ inputs.environment_name }}
        env:
            PACKAGE_NAME: ${{ inputs.package_name }}
            PACKAGE_PATH: ${{ inputs.package_path }}
            RELEASE_BRANCH: ${{ inputs.branch }}
            TAG_PREFIX: ${{ inputs.tag_prefix }}
            VERSION_BUMP: ${{ inputs.version_bump }}
        steps:
            - name: Checkout release branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.branch }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Require production deploy key
              if: inputs.prerelease == false
              env:
                  RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
              run: |
                  if [[ -z "$RELEASE_DEPLOY_KEY" ]]; then
                      echo "The npm-production environment must provide RELEASE_DEPLOY_KEY."
                      exit 1
                  fi

            - name: Update release branch
              run: git pull --ff-only origin "$RELEASE_BRANCH"

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 11.24.0

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org
                  scope: '@wesflo'

            # Temporarily disabled while verifying the release commit and tag push.
            - name: Install dependencies
              if: ${{ false }}
              run: pnpm install --frozen-lockfile

            - name: Build internal dependencies
              if: ${{ false }}
              run: pnpm --filter "$PACKAGE_NAME^..." build

            - name: Test package
              if: ${{ false }}
              run: pnpm --dir "$PACKAGE_PATH" test

            - name: Create release version
              id: version
              env:
                  IS_PRERELEASE: ${{ inputs.prerelease }}
              working-directory: ${{ inputs.package_path }}
              run: |
                  current_version="$(node --print "require('./package.json').version")"

                  if [[ "$IS_PRERELEASE" == "true" ]]; then
                      if [[ "$current_version" == *-alpha.* ]]; then
                          bump="prerelease"
                      else
                          bump="pre$VERSION_BUMP"
                      fi
                      pnpm version "$bump" --preid alpha --no-git-tag-version
                  else
                      pnpm version "$VERSION_BUMP" --no-git-tag-version
                  fi

                  version="$(node --print "require('./package.json').version")"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Build package
              if: ${{ false }}
              run: pnpm --dir "$PACKAGE_PATH" build

            - name: Check Git tag
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  tag="$TAG_PREFIX-v$VERSION"
                  git fetch --tags --force
                  if git rev-parse --verify --quiet "refs/tags/$tag"; then
                      echo "Git tag $tag already exists."
                      exit 1
                  fi

            - name: Publish production package
              if: ${{ false }}
              working-directory: ${{ inputs.package_path }}
              run: npm publish --access public

            - name: Publish alpha package
              if: ${{ false }}
              working-directory: ${{ inputs.package_path }}
              run: npm publish --access public --tag alpha

            - name: Commit and tag released version
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  tag="$TAG_PREFIX-v$VERSION"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$PACKAGE_PATH/package.json" pnpm-lock.yaml
                  git commit -m "release($TAG_PREFIX): v$VERSION"
                  git tag --annotate "$tag" --message "$PACKAGE_NAME v$VERSION"

            - name: Push alpha release
              if: inputs.prerelease == true
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  tag="$TAG_PREFIX-v$VERSION"
                  gh auth setup-git
                  git push --atomic origin "HEAD:$RELEASE_BRANCH" "refs/tags/$tag"

            - name: Push production release with deploy key
              if: inputs.prerelease == false
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  tag="$TAG_PREFIX-v$VERSION"
                  eval "$(ssh-agent -s)"
                  trap 'ssh-agent -k' EXIT
                  if ! printf '%s\n' "$RELEASE_DEPLOY_KEY" | SSH_ASKPASS=/bin/false SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add -; then
                      echo "::error::RELEASE_DEPLOY_KEY must contain a valid private SSH key without a passphrase."
                      exit 1
                  fi
                  ssh-add -l
                  mkdir -p "$RUNNER_TEMP/lockxy-release-ssh"
                  gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$RUNNER_TEMP/lockxy-release-ssh/known_hosts"
                  git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
                  GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/lockxy-release-ssh/known_hosts" \
                  git push --atomic origin "HEAD:$RELEASE_BRANCH" "refs/tags/$tag"
