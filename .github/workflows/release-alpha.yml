name: Alpha release

run-name: Alpha release from ${{ github.ref_name }}

on:
    workflow_dispatch:
        inputs:
            vite_plugin:
                description: Release Vite Plugin alpha package
                required: true
                default: false
                type: boolean
            panel:
                description: Release Panel alpha package
                required: true
                default: false
                type: boolean
            version_bump:
                description: Version update for selected npm packages
                required: true
                default: minor
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: read

concurrency:
    group: alpha-release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    validate:
        name: Validate alpha release
        runs-on: ubuntu-latest
        steps:
            - name: Require feature branch and a selection
              env:
                  PANEL: ${{ inputs.panel }}
                  VITE_PLUGIN: ${{ inputs.vite_plugin }}
              run: |
                  if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" == "main" ]]; then
                      echo "Alpha releases require a feature branch."
                      exit 1
                  fi
                  if [[ "$VITE_PLUGIN" != "true" && "$PANEL" != "true" ]]; then
                      echo "Select at least one release target."
                      exit 1
                  fi

    vite_plugin:
        needs: validate
        if: inputs.vite_plugin == true
        permissions:
            contents: write
            id-token: write
        uses: ./.github/workflows/release-package.yml
        with:
            package_path: packages/vite-plugin-lockxy
            package_name: '@wesflo/vite-plugin-lockxy'
            tag_prefix: vite-plugin-lockxy
            prerelease: true
            version_bump: ${{ inputs.version_bump }}
            branch: ${{ github.ref_name }}
            environment_name: npm-alpha

    panel:
        needs: [validate, vite_plugin]
        if: >-
            ${{ always() && needs.validate.result == 'success' && inputs.panel == true }}


        permissions:
            contents: write
            id-token: write
        uses: ./.github/workflows/release-package.yml
        with:
            package_path: packages/lockxy-panel
            package_name: '@wesflo/lockxy-panel'
            tag_prefix: lockxy-panel
            prerelease: true
            version_bump: ${{ inputs.version_bump }}
            branch: ${{ github.ref_name }}
            environment_name: npm-alpha
