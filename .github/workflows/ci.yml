name: Continuous integration

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            TURBO_TELEMETRY_DISABLED: 1
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 11.24.0

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format sources
              run: pnpm prettier:w

            - name: Commit formatting or require a clean diff
              env:
                  ACTOR: ${{ github.actor }}
                  BASE_REPOSITORY: ${{ github.repository }}
                  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
                  EVENT_NAME: ${{ github.event_name }}
                  GH_TOKEN: ${{ github.token }}
                  HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  REF_TYPE: ${{ github.ref_type }}
              run: |
                  if git diff --quiet; then
                      echo "Formatting is already up to date."
                      exit 0
                  fi

                  can_push=false
                  if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" && "$BRANCH_NAME" != "main" && "$ACTOR" != "dependabot[bot]" ]]; then
                      can_push=true
                  fi
                  if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_TYPE" == "branch" && "$BRANCH_NAME" != "main" ]]; then
                      can_push=true
                  fi

                  if [[ "$can_push" != "true" ]]; then
                      echo "Formatting changes cannot be pushed from this read-only run."
                      git diff --exit-code
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add --all
                  git commit -m "style: apply Prettier formatting"
                  gh auth setup-git
                  git push origin "HEAD:$BRANCH_NAME"

    validate:
        name: ${{ matrix.check }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                check:
                    - Test
                    - Lint
                    - Build
        env:
            TURBO_TELEMETRY_DISABLED: 1
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 11.24.0

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              if: matrix.check == 'Test'
              run: pnpm test

            - name: Lint
              if: matrix.check == 'Lint'
              run: pnpm lint

            - name: Build packages
              if: matrix.check == 'Build'
              run: pnpm --filter "./packages/**" build
